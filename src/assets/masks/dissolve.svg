<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 2100" preserveAspectRatio="none">
  <!-- Opaque (0–1000), a narrow absorption edge (1000–1100), transparent (1100–2100).
       Sliding it upward wipes the masked artwork away from the bottom edge. -->
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="absorb" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.004 0.02" numOctaves="1" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="50" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <g filter="url(#absorb)">
    <rect x="-100" y="-100" width="1200" height="1100" fill="#fff"/>
    <rect x="-100" y="1000" width="1200" height="100" fill="url(#edge)"/>
  </g>
</svg>
