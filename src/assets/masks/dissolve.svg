<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 2200" preserveAspectRatio="none">
  <!-- Opaque (0–1000), a soft irregular erosion band (1000–1200), transparent (1200–2200).
       Sliding it upward erodes the masked layer from the bottom edge. -->
  <defs>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="absorb" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.018" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="280" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <g filter="url(#absorb)">
    <rect x="-200" y="-200" width="1400" height="1200" fill="#fff"/>
    <rect x="-200" y="1000" width="1400" height="200" fill="url(#band)"/>
  </g>
</svg>
