        <button class="Drum" type="button" kit-drum data-piece="kick" data-kind="kick" data-key="k" aria-keyshortcuts="K" style="--x: 58.8; --y: 79.2; --d: 29.4"><kbd aria-hidden="true">k</kbd><span>Kick</span></button>
